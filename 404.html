<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/nvarog-health-identity-demo/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/nvarog-health-identity-demo/favicon.png" />
    <link rel="apple-touch-icon" href="/nvarog-health-identity-demo/apple-touch-icon.png" />
    <title>NVAROG</title>
    <script type="module" crossorigin src="/nvarog-health-identity-demo/assets/index-Cjjy1LkG.js"></script>
    <link rel="stylesheet" crossorigin href="/nvarog-health-identity-demo/assets/index-DS8jczir.css">
  </head>
  <body>
    <div id="root"></div>
    <!--
      A raw page-load counter for the deployed demo, added on request so the user can tell
      whether the shared link has been opened at all. visitor-badge.laobi.icu needs no account/
      API key — it just increments a number keyed by the page_id below and serves it back as an
      SVG. It counts every page load (not de-duplicated per visitor, no free-tier SLA) and
      carries no identifying information — no names, no IPs are exposed back to us, nothing
      beyond "loaded N times." To check the count: open
      https://visitor-badge.laobi.icu/badge?page_id=sunnymrawal-lab.nvarog-health-identity-demo
      in a browser — note that opening it to check also bumps the count by 1 (confirmed live:
      it went 1 → 2 just from being viewed twice), so subtract your own checks when reading it.
    -->
    <img
      src="https://visitor-badge.laobi.icu/badge?page_id=sunnymrawal-lab.nvarog-health-identity-demo"
      alt=""
      width="1"
      height="1"
      style="position:absolute;top:0;left:0;opacity:0;pointer-events:none"
    />
    <!-- Cloudflare Web Analytics -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "9e0c403799d34d3fafc7ef7b8d795a01"}'></script>
    <!-- End Cloudflare Web Analytics -->
    <!--
      Viewer-identity watermark: a faint, tiled overlay stamping the signed-in viewer's email +
      timestamp across the page. It is a no-op unless Cloudflare Access is actually protecting
      this hostname — the /cdn-cgi/access/get-identity fetch just 404s and the catch swallows it,
      so this is safe to ship ahead of Access being turned on here. Purpose is traceability if a
      screenshot leaks (there is no way to actually block screenshots from a webpage), not access
      control — Access itself is what gates entry.
    -->
    <script>
    (function () {
      function escapeXml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c];
        });
      }
      function renderWatermark(label) {
        if (document.getElementById("__cf_watermark")) return;
        var text = escapeXml(label);
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="380" height="220">' +
          '<text x="0" y="110" transform="rotate(-28 190 110)" ' +
          'font-family="system-ui, sans-serif" font-size="14" fill="rgba(0,0,0,0.07)" text-anchor="middle">' +
          text +
          "</text></svg>";
        var url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
        var div = document.createElement("div");
        div.id = "__cf_watermark";
        div.style.cssText = [
          "position:fixed",
          "inset:0",
          "z-index:2147483647",
          "pointer-events:none",
          "background-image:url('" + url + "')",
          "background-repeat:repeat"
        ].join(";");
        document.body.appendChild(div);
      }
      fetch("/cdn-cgi/access/get-identity", { credentials: "include" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (identity) {
          var email = identity && (identity.email || (identity.user_identity && identity.user_identity.email));
          if (!email) return;
          var stamp = email + "  ·  " + new Date().toLocaleString();
          renderWatermark(stamp);
        })
        .catch(function () {});
    })();
    </script>
  </body>
</html>
